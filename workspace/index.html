<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; margin: 20px auto; }
    .cell { width: 100px; height: 100px; background: #f0f0f0; border: 1px solid #999; display: flex; justify-content: center; align-items: center; font-size: 48px; cursor: pointer; }
    .status { margin: 20px; font-size: 24px; }
    button { font-size: 18px; padding: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tic-tac-toe.js"></script>
</body>
</html>
